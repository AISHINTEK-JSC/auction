server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # public/storage is a symlink into storage/app/public, which is mounted separately.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        # Uploads are stored under random names and never rewritten in place,
        # so a browser may keep them for good.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    # Generated by the app (it names the sitemap's full URL), so it goes to PHP.
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        # Vite preload Link headers plus cookies can exceed the default 4k/8k buffers.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
